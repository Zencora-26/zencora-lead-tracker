<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zencora Health Solutions | BDE Lead Tracker</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- ChartJS for Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* Design Tokens & Variables */
        :root {
            --primary: #8C1D1D;          /* Zencora Burgundy */
            --primary-light: #FCE8E8;    /* Light Burgundy Fill */
            --secondary: #2A628F;        /* Slate Blue */
            --secondary-light: #EBF2F7;  /* Light Slate Fill */
            --text-dark: #2B2B2B;       /* Charcoal Black */
            --text-muted: #787878;      /* Muted Gray */
            --bg-page: #F5F7FA;          /* Ice gray */
            --bg-card: rgba(255, 255, 255, 0.85);
            --border-color: #E2E8F0;
            --border-radius-lg: 16px;
            --border-radius-md: 10px;
            --border-radius-sm: 6px;
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.02);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.03);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Reset & Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        h1, h2, h3, h4 {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
        }

        /* App Layout Container */
        .app-container {
            display: none; /* hidden until authenticated */
            min-height: 100vh;
            position: relative;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #1E0606 0%, #0A141C 100%);
            color: #FFFFFF;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.15);
        }
        .sidebar-brand {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 1.5rem;
        }
        .sidebar-logo {
            font-size: 1.5rem;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            color: #FFFFFF;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-logo span {
            color: #FF5A5A;
        }
        .sidebar-subtitle {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 4px;
        }
        
        /* Active User Badge in Sidebar */
        .user-profile-badge {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius-md);
            padding: 10px 14px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--primary);
            color: #FFFFFF;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
        }
        .user-meta {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .user-meta-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #FFFFFF;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .user-meta-role {
            font-size: 0.7rem;
            font-weight: 500;
            color: #8C1D1D;
            background-color: var(--primary-light);
            padding: 1px 6px;
            border-radius: 4px;
            width: fit-content;
            text-transform: uppercase;
            margin-top: 2px;
        }
        .user-meta-role.role-bde {
            color: var(--secondary);
            background-color: var(--secondary-light);
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }
        .nav-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-radius: var(--border-radius-md);
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.7);
            transition: var(--transition);
            gap: 12px;
        }
        .nav-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: #FFFFFF;
        }
        .nav-item.active {
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            color: #FFFFFF;
            box-shadow: 0 4px 12px rgba(140, 29, 29, 0.3);
        }
        .sidebar-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .sync-btn {
            background: linear-gradient(90deg, #27AE60 0%, #2ECC71 100%);
            color: #FFFFFF;
            border: none;
            padding: 12px;
            border-radius: var(--border-radius-md);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.2);
            transition: var(--transition);
        }
        .sync-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(46, 204, 113, 0.3);
        }
        .sync-btn:active {
            transform: translateY(0);
        }
        
        .logout-btn {
            background-color: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.6);
            padding: 10px;
            border-radius: var(--border-radius-md);
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition);
        }
        .logout-btn:hover {
            background-color: rgba(231, 76, 60, 0.15);
            color: #E74C3C;
            border-color: rgba(231, 76, 60, 0.3);
        }

        /* Main Content Frame */
        .main-content {
            margin-left: 280px;
            flex-grow: 1;
            padding: 2.5rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* Top Header Bar */
        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            padding: 1.25rem 2rem;
            border-radius: var(--border-radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }
        .header-title h2 {
            font-size: 1.6rem;
            color: var(--primary);
            letter-spacing: -0.5px;
        }
        .header-title p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .header-actions {
            display: flex;
            gap: 12px;
        }
        .btn {
            padding: 10px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: var(--border-radius-md);
            cursor: pointer;
            border: 1px solid transparent;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background-color: var(--primary);
            color: #FFFFFF;
        }
        .btn-primary:hover {
            background-color: #6E1616;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background-color: #FFFFFF;
            border-color: var(--border-color);
            color: var(--text-dark);
        }
        .btn-secondary:hover {
            background-color: var(--bg-page);
            border-color: #CBD5E1;
            transform: translateY(-1px);
        }

        /* View Panels */
        .view-panel {
            display: none;
            flex-direction: column;
            gap: 2rem;
            animation: fadeIn 0.35s ease;
        }
        .view-panel.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Status Cards Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
        }
        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius-lg);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: #CBD5E1;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background-color: var(--secondary);
        }
        .stat-card.accent::before {
            background-color: var(--primary);
        }
        .stat-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-dark);
            font-family: 'Outfit', sans-serif;
        }
        .stat-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Leads Spreadsheet Section */
        .leads-section {
            background: var(--bg-card);
            border-radius: var(--border-radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }
        .leads-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.25rem;
        }
        .search-filter-box {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            flex-grow: 1;
        }
        .input-search {
            padding: 10px 16px;
            border-radius: var(--border-radius-md);
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
            width: 260px;
            transition: var(--transition);
        }
        .input-search:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(42, 98, 143, 0.15);
        }
        .select-filter {
            padding: 10px 16px;
            border-radius: var(--border-radius-md);
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
            background-color: #FFFFFF;
            cursor: pointer;
            transition: var(--transition);
        }
        .select-filter:focus {
            outline: none;
            border-color: var(--secondary);
        }

        /* Modern Table Customization */
        .table-wrapper {
            overflow-x: auto;
            border-radius: var(--border-radius-md);
            border: 1px solid var(--border-color);
            position: relative;
            background-color: #FFFFFF;
        }
        .leads-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
            text-align: left;
        }
        .leads-table th {
            background-color: var(--primary-light);
            color: var(--primary);
            font-weight: 700;
            padding: 14px 16px;
            border-bottom: 2px solid #F3A8A8;
            font-family: 'Outfit', sans-serif;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .leads-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-dark);
            white-space: nowrap;
            transition: var(--transition);
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .leads-table tr:hover td {
            background-color: #F8FAFC;
        }
        
        /* Cell editable highlight */
        .leads-table td.editable {
            cursor: pointer;
            position: relative;
        }
        .leads-table td.editable:hover::after {
            content: '✏️';
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.7rem;
            opacity: 0.6;
        }
        
        /* Inline input styling */
        .cell-input {
            width: 100%;
            padding: 6px 8px;
            font-family: inherit;
            font-size: inherit;
            border: 1px solid var(--secondary);
            border-radius: var(--border-radius-sm);
            outline: none;
            box-shadow: 0 0 0 2px rgba(42, 98, 143, 0.15);
        }

        /* Pill Badges for Statuses */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.2px;
        }
        .badge-sourced { background-color: #F3F4F6; color: #4B5563; }
        .badge-contacted { background-color: #E0E7FF; color: #4338CA; }
        .badge-demo { background-color: #DBEAFE; color: #1E40AF; }
        .badge-proposal { background-color: #FEF3C7; color: #92400E; }
        .badge-negotiating { background-color: #FFF3CD; color: #856404; font-weight: 700; }
        .badge-won { background-color: #D1FAE5; color: #065F46; font-weight: 700; border: 1px solid #A7F3D0; }
        .badge-lost { background-color: #FEE2E2; color: #991B1B; border: 1px solid #FECACA; }

        /* Follow-up Badges */
        .badge-fu-active { background-color: #ECFDF5; color: #047857; font-weight: 600; }
        .badge-fu-none { background-color: #F3F4F6; color: #6B7280; }
        .badge-fu-cadence { background-color: #FEF3C7; color: #D97706; }

        /* Double-pane Layout for Analytics & SOP */
        .analytics-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 1.5rem;
        }
        @media (max-width: 1100px) {
            .analytics-grid {
                grid-template-columns: 1fr;
            }
        }
        .dashboard-card {
            background: var(--bg-card);
            border-radius: var(--border-radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        .card-title h3 {
            font-size: 1.15rem;
            color: var(--secondary);
        }
        .card-title p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        
        /* SOP Content Styles */
        .sop-timeline {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            position: relative;
            padding-left: 20px;
        }
        .sop-timeline::before {
            content: '';
            position: absolute;
            left: 5px;
            top: 0;
            width: 2px;
            height: 100%;
            background-color: var(--border-color);
        }
        .timeline-step {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .timeline-step::before {
            content: '';
            position: absolute;
            left: -20px;
            top: 4px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--secondary);
            border: 3px solid #FFFFFF;
            box-shadow: 0 0 0 2px var(--secondary-light);
        }
        .timeline-step.active::before {
            background-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-light);
        }
        .step-day {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
        }
        .step-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-dark);
        }
        .step-desc {
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Copy Mail Card Component */
        .mail-interpolator {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }
        .selector-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .textarea-preview {
            width: 100%;
            height: 250px;
            padding: 14px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            line-height: 1.5;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            resize: none;
            background-color: #FAF8F8;
            color: var(--text-dark);
            outline: none;
            transition: var(--transition);
        }
        .textarea-preview:focus {
            border-color: var(--primary);
            background-color: #FFFFFF;
        }

        /* Slide-over Drawer / Modal */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(10, 20, 28, 0.4);
            backdrop-filter: blur(4px);
            z-index: 500;
            display: none;
            justify-content: flex-end;
            animation: fadeInOverlay 0.25s ease;
        }
        .drawer {
            width: 500px;
            background-color: #FFFFFF;
            height: 100%;
            box-shadow: -10px 0 30px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            padding: 2.5rem 2rem;
            gap: 1.5rem;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
        }
        @keyframes fadeInOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }
        .drawer-header h3 {
            font-size: 1.3rem;
            color: var(--primary);
        }
        .close-btn {
            font-size: 1.5rem;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition);
        }
        .close-btn:hover {
            color: var(--primary);
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dark);
        }
        .form-input {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
        }
        .form-input:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(42, 98, 143, 0.1);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .form-actions {
            margin-top: 1rem;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        
        /* Objection Cards */
        .objection-card {
            background-color: #FFFFFF;
            border-left: 4px solid var(--primary);
            border-radius: var(--border-radius-md);
            padding: 1.25rem;
            margin-bottom: 1rem;
            border-top: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }
        .objection-card:hover {
            transform: translateX(4px);
            box-shadow: var(--shadow-md);
        }
        .objection-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 6px;
        }
        .objection-strategy {
            font-size: 0.85rem;
            color: var(--text-dark);
            line-height: 1.5;
        }

        /* Bulk Uploader Box */
        .uploader-box {
            border: 2px dashed #CBD5E1;
            padding: 1.5rem;
            border-radius: var(--border-radius-md);
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background-color: #F8FAFC;
        }
        .uploader-box:hover {
            border-color: var(--secondary);
            background-color: var(--secondary-light);
        }
        .uploader-icon {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: var(--secondary);
        }
        .uploader-text {
            font-size: 0.85rem;
            color: var(--text-dark);
            font-weight: 500;
        }
        .uploader-subtext {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* ==================================================== */
        /* PREMIUM LOGIN CONTAINER STYLES (NEW) */
        /* ==================================================== */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1E0606 0%, #0A141C 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1.5rem;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            color: #FFFFFF;
            animation: fadeIn 0.4s ease;
        }
        .login-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .login-logo {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: 1px;
        }
        .login-logo span {
            color: #FF5A5A;
        }
        .login-subtitle {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .login-welcome {
            text-align: center;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 0.5rem;
        }
        .login-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--border-radius-md);
            color: #FFFFFF;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }
        .login-input:focus {
            border-color: #FF5A5A;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 3px rgba(255, 90, 90, 0.2);
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
            color: #FFFFFF;
            font-weight: 700;
            font-size: 0.95rem;
            border-radius: var(--border-radius-md);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 0.5rem;
            box-shadow: 0 4px 15px rgba(140, 29, 29, 0.4);
        }
        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(140, 29, 29, 0.5);
        }
        .login-error {
            color: #F87171;
            font-size: 0.8rem;
            font-weight: 500;
            text-align: center;
            background-color: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.2);
            padding: 8px 12px;
            border-radius: var(--border-radius-sm);
            display: none;
        }

        /* Profile & Modal Glassmorphism Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1100;
            padding: 1.5rem;
        }
        .modal-card {
            width: 100%;
            max-width: 520px;
            background: #121A21;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            animation: fadeIn 0.3s ease;
            position: relative;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .modal-title h3 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #FFFFFF;
            margin-bottom: 4px;
        }
        .modal-title p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Interactive Profile Styles */
        .profile-avatar-container {
            position: relative;
            width: 88px;
            height: 88px;
            margin: 0 auto;
            cursor: pointer;
            border-radius: 50%;
        }
        .profile-avatar-img {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--secondary);
            background: #202b36;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: #FFFFFF;
        }
        .avatar-upload-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: var(--transition);
            color: #FFFFFF;
            font-size: 0.7rem;
            font-weight: 600;
            gap: 2px;
        }
        .profile-avatar-container:hover .avatar-upload-overlay {
            opacity: 1;
        }
        .profile-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--border-radius-md);
            padding: 1rem;
        }
        .profile-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .profile-field-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .profile-field-value {
            font-size: 0.92rem;
            color: #FFFFFF;
            font-weight: 500;
            word-break: break-all;
        }
        .profile-locked-badge {
            font-size: 0.65rem;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-left: 6px;
            font-weight: 500;
        }

        /* Tabs Pill Selector */
        .subtab-pills {
            display: flex;
            gap: 8px;
            margin-bottom: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }
        .subtab-pill {
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid transparent;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .subtab-pill:hover {
            color: #FFFFFF;
            background: rgba(255, 255, 255, 0.1);
        }
        .subtab-pill.active {
            background: var(--primary);
            color: #FFFFFF;
            border-color: var(--primary);
        }
        .count-pill {
            background: rgba(255, 255, 255, 0.2);
            color: #FFFFFF;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 700;
        }

</head>
<body>

    <!-- 1. LOGIN OVERLAY SCREEN -->
    <div id="login-overlay" class="login-overlay">
        <form class="login-card" onsubmit="handleLogin(event)">
            <div class="login-brand">
                <div class="login-logo">Zencora<span>.</span></div>
                <div class="login-subtitle">HEALTH SOLUTIONS</div>
            </div>
            
            <p class="login-welcome">Sign in with your User ID, Work Email, or Registered Mobile Number.</p>
            
            <div class="login-error" id="login-error-message">Invalid credentials.</div>
            
            <div class="form-group">
                <label style="color: rgba(255,255,255,0.7); font-size:0.8rem">User ID, Email, or Mobile Number</label>
                <input type="text" id="login-username" class="login-input" required placeholder="e.g. ceo, ceo@zencorahs.com, +1 555-0100" autofocus autocomplete="username">
            </div>

            <div class="form-group" style="margin-bottom: 0.25rem;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label style="color: rgba(255,255,255,0.7); font-size:0.8rem">Password</label>
                    <a href="#" onclick="openForgotPasswordModal(event)" style="color: #FF7675; font-size: 0.78rem; text-decoration: none; font-weight: 500;">Forgot Password?</a>
                </div>
                <input type="password" id="login-password" class="login-input" required placeholder="••••••••" autocomplete="current-password" style="margin-top: 4px;">
            </div>

            <button type="submit" class="login-btn">
                Authenticate Securely
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 15V17M12 9V11M8 11H16V18H8V11ZM10 11V7C10 5.89543 10.8954 5 12 5C13.1046 5 14 5.89543 14 7V11"/></svg>
            </button>
        </form>
    </div>

    <!-- FORGOT PASSWORD & OTP MODAL -->
    <div id="forgot-password-modal" class="modal-overlay" onclick="closeForgotPasswordModal(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title">
                    <h3 id="fp-title">Reset Your Password</h3>
                    <p id="fp-desc">Verify your identity via 6-digit OTP sent to your registered Email or Mobile.</p>
                </div>
                <button class="close-btn" onclick="hideForgotPasswordModal()">&times;</button>
            </div>

            <div id="fp-alert" class="login-error" style="display:none; text-align:left;"></div>

            <!-- Step 1: Request OTP -->
            <form id="fp-step-1" onsubmit="handleRequestOtp(event)" style="display: flex; flex-direction: column; gap: 1rem;">
                <div class="form-group">
                    <label style="color: rgba(255,255,255,0.7); font-size:0.8rem">Registered User ID, Email, or Mobile Number *</label>
                    <input type="text" id="fp-identifier" class="form-input" required placeholder="e.g. Prakash_Zencora, prakash@zencorahs.com, +1 303-968-9512" autocomplete="off">
                </div>
                <button type="submit" id="btn-request-otp" class="btn btn-primary" style="justify-content: center; width: 100%;">
                    Send 6-Digit OTP Code
                </button>
            </form>

            <!-- Step 2: Verify OTP & Reset Password -->
            <form id="fp-step-2" onsubmit="handleVerifyOtpAndReset(event)" style="display: none; flex-direction: column; gap: 1rem;">
                <div id="fp-destination-banner" style="background: rgba(46, 204, 113, 0.12); border: 1px solid rgba(46, 204, 113, 0.3); border-radius: var(--border-radius-sm); padding: 10px 14px; font-size: 0.82rem; color: #2ECC71;">
                    <!-- Destination dynamic text -->
                </div>

                <div class="form-group">
                    <label style="color: rgba(255,255,255,0.7); font-size:0.8rem">6-Digit OTP Code *</label>
                    <input type="text" id="fp-otp" class="form-input" required placeholder="e.g. 849201" maxlength="6" style="letter-spacing: 4px; font-size: 1.1rem; text-align: center; font-weight: 700;">
                </div>

                <div class="form-group">
                    <label style="color: rgba(255,255,255,0.7); font-size:0.8rem">New Password *</label>
                    <input type="password" id="fp-new-password" class="form-input" required placeholder="At least 4 characters" minlength="4">
                </div>

                <div class="form-group">
                    <label style="color: rgba(255,255,255,0.7); font-size:0.8rem">Confirm New Password *</label>
                    <input type="password" id="fp-confirm-password" class="form-input" required placeholder="Repeat new password" minlength="4">
                </div>

                <div style="display: flex; gap: 8px;">
                    <button type="button" class="btn btn-secondary" onclick="backToFpStep1()" style="flex: 1; justify-content: center;">
                        Back
                    </button>
                    <button type="submit" id="btn-reset-password" class="btn btn-primary" style="flex: 2; justify-content: center;">
                        Set New Password
                    </button>
                </div>
            </form>
        </div>
    </div>


    <!-- 2. MAIN APPLICATION WORKSPACE -->
    <div class="app-container" id="app-workspace">
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h1 class="sidebar-logo">Zencora<span>.</span></h1>
                <span class="sidebar-subtitle">HEALTH SOLUTIONS</span>
            </div>
            
            <!-- User Status Profile Card -->
            <div class="user-profile-badge" style="justify-content: space-between; cursor: pointer;" onclick="openProfileDrawer()" title="View and manage personal profile">
                <div style="display: flex; align-items: center; gap: 10px; overflow: hidden;">
                    <div class="avatar-circle" id="user-avatar" style="overflow: hidden; display: flex; align-items: center; justify-content: center;">-</div>
                    <div class="user-meta">
                        <span class="user-meta-name" id="user-display-name">Loading...</span>
                        <div style="display: flex; align-items: center; gap: 4px;">
                            <span class="user-meta-role" id="user-role-badge">BDE</span>
                            <span style="font-size: 0.65rem; color: rgba(255,255,255,0.4);">• Profile</span>
                        </div>
                    </div>
                </div>
                <button type="button" title="My Profile & Security" onclick="event.stopPropagation(); openProfileDrawer();" style="background:none; border:none; color:rgba(255,255,255,0.6); cursor:pointer; padding:4px; font-size:1.1rem; transition:var(--transition);" onmouseover="this.style.color='#FFFFFF'" onmouseout="this.style.color='rgba(255,255,255,0.6)'">
                    ⚙️
                </button>
            </div>

            
            <ul class="nav-list">
                <li class="nav-item active" onclick="switchView('view-spreadsheet', this)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3zM21 9H3M21 15H3M12 3v18"/></svg>
                    Lead Spreadsheet
                </li>
                <li class="nav-item" onclick="switchView('view-analytics', this)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
                    Analytics & Charts
                </li>
                <li class="nav-item" onclick="switchView('view-sop', this)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
                    SOP & Objections
                </li>
                <!-- Admin-Only Tab -->
                <li class="nav-item" id="nav-users" style="display:none" onclick="switchView('view-users', this)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    BDE Registries
                </li>
            </ul>
            
            <div class="sidebar-footer">
                <button class="sync-btn" onclick="syncAndDownloadExcel()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                    Export Styled Excel
                </button>
                <button class="logout-btn" onclick="openPasswordDrawer()" style="border-color: rgba(255, 255, 255, 0.2);">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-2-2l2 2M3 11v-1a8 8 0 0 1 15.66-2.31M15.5 15.5l5.5 5.5m0 0l-2.5-2.5m2.5 2.5l2.5-2.5"/><circle cx="7.5" cy="15.5" r="4.5"/></svg>
                    Change Password
                </button>
                <button class="logout-btn" onclick="handleLogout()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                    Logout Session
                </button>
            </div>
        </aside>

        <!-- Main Window -->
        <main class="main-content">
            
            <!-- Global Header -->
            <header class="content-header">
                <div class="header-title">
                    <h2 id="header-panel-title">BDE Lead Tracker Database</h2>
                    <p id="header-panel-desc">Real-time collaborative workspace for Zencora's Business Development Executives.</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-secondary" id="btn-bulk-import" onclick="openBulkImport()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                        Bulk Import
                    </button>
                    <button class="btn btn-primary" onclick="openNewLeadDrawer()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Add New Lead
                    </button>
                </div>
            </header>

            <!-- STATS QUICK VIEW -->
            <section class="stats-grid">
                <div class="stat-card accent">
                    <div class="stat-label">Total Pipeline Value</div>
                    <div class="stat-value" id="stat-pipeline">$0</div>
                    <div class="stat-desc">Est. monthly value of active leads</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Active Prospects</div>
                    <div class="stat-value" id="stat-active">0</div>
                    <div class="stat-desc">Leads in outreach or negotiation</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Closed-Won (July)</div>
                    <div class="stat-value" id="stat-won">0</div>
                    <div class="stat-desc">Prospects onboarded this month</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Win Rate %</div>
                    <div class="stat-value" id="stat-winrate">0.0%</div>
                    <div class="stat-desc">Won leads vs total resolved leads</div>
                </div>
            </section>


            <!-- PANEL 1: SPREADSHEET VIEW -->
            <div id="view-spreadsheet" class="view-panel active">
                
                <div class="leads-section">
                    <div class="leads-toolbar">
                        <div class="search-filter-box">
                            <input type="text" id="search-query" class="input-search" placeholder="Search Clinic, Contact, or EHR..." oninput="filterLeads()" autocomplete="off" spellcheck="false">
                            
                            <select id="filter-stage" class="select-filter" onchange="filterLeads()">
                                <option value="">All Lead Stages</option>
                                <option value="Sourced">Sourced</option>
                                <option value="Contacted">Contacted</option>
                                <option value="Discovery Scheduled">Discovery Scheduled</option>
                                <option value="Proposal Sent">Proposal Sent</option>
                                <option value="Negotiating">Negotiating</option>
                                <option value="Closed-Won">Closed-Won</option>
                                <option value="Closed-Lost">Closed-Lost</option>
                            </select>

                            <!-- BDE filter (Hidden for BDEs, Admin Only) -->
                            <select id="filter-bde" class="select-filter" onchange="filterLeads()">
                                <option value="">All BDEs</option>
                            </select>

                            <select id="filter-channel" class="select-filter" onchange="filterLeads()">
                                <option value="">All Channels</option>
                                <option value="Email">Email</option>
                                <option value="LinkedIn">LinkedIn</option>
                                <option value="Cold Call">Cold Call</option>
                            </select>
                        </div>
                        
                        <div style="font-size: 0.85rem; color: var(--text-muted)">
                            <span id="filtered-count">0</span> of <span id="total-count">0</span> leads showing
                        </div>
                    </div>

                    <div class="table-wrapper">
                        <table class="leads-table" id="leads-table">
                            <thead>
                                <tr>
                                    <th>Lead ID</th>
                                    <th>Practice/Clinic Name</th>
                                    <th>Specialty</th>
                                    <th>Contact Name</th>
                                    <th>Title</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>EHR System</th>
                                    <th>Stage</th>
                                    <th>Follow-up Status</th>
                                    <th>Value (Mo)</th>
                                    <th>BDE</th>
                                    <th>Last Touch</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="leads-tbody">
                                <!-- Dynamic rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- PANEL 2: ANALYTICS VIEW -->
            <div id="view-analytics" class="view-panel">
                <div class="analytics-grid">
                    
                    <!-- Chart card -->
                    <div class="dashboard-card">
                        <div class="card-header">
                            <div class="card-title">
                                <h3>Lead Stages Distribution</h3>
                                <p>Volume of leads segmented by active pipeline steps</p>
                            </div>
                        </div>
                        <div style="height: 350px; position: relative;">
                            <canvas id="chart-stages"></canvas>
                        </div>
                    </div>

                    <!-- Pipeline Value Chart -->
                    <div class="dashboard-card">
                        <div class="card-header">
                            <div class="card-title">
                                <h3>Revenue Pipeline Value ($)</h3>
                                <p>Estimated monthly value of contracts per stage</p>
                            </div>
                        </div>
                        <div style="height: 350px; position: relative;">
                            <canvas id="chart-values"></canvas>
                        </div>
                    </div>

                </div>

                <div class="analytics-grid">
                    <!-- BDE Table Card -->
                    <div class="dashboard-card" id="card-bde-performance">
                        <div class="card-header">
                            <div class="card-title">
                                <h3>BDE Performance Metrics</h3>
                                <p>Summary of active listings, conversions, and estimated values by owner</p>
                            </div>
                        </div>
                        <div class="table-wrapper">
                            <table class="leads-table">
                                <thead>
                                    <tr>
                                        <th>BDE Executive</th>
                                        <th style="text-align:center">Leads Managed</th>
                                        <th style="text-align:center">Closed-Won</th>
                                        <th style="text-align:right">Win Rate %</th>
                                        <th style="text-align:right">Revenue Won (Mo)</th>
                                    </tr>
                                </thead>
                                <tbody id="bde-metrics-tbody">
                                    <!-- Dynamic BDE performance records -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- EHR stats card -->
                    <div class="dashboard-card">
                        <div class="card-header">
                            <div class="card-title">
                                <h3>Top EHR / Practice Systems</h3>
                                <p>Top electronic platforms target clinics are running (helps focus pitches)</p>
                            </div>
                        </div>
                        <div class="table-wrapper">
                            <table class="leads-table">
                                <thead>

            const newPassword = document.getElementById('pwd-new').value.trim();
            const confirmPassword = document.getElementById('pwd-confirm').value.trim();
            const errorMsg = document.getElementById('pwd-error-msg');

            errorMsg.style.display = 'none';

            if (newPassword !== confirmPassword) {
                errorMsg.innerText = "New passwords do not match.";
                errorMsg.style.display = 'block';
                return;
            }

            if (newPassword.length < 4) {
                errorMsg.innerText = "Password must be at least 4 characters.";
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const response = await fetchWithAuth('/api/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ currentPassword, newPassword })
                });

                if (response.ok) {

            }

            try {

                if (response.status === 401) {
                    console.warn("Unauthorised response received. Session terminated.");

        // Client-side instant image resize & upload
        async function handleAvatarUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                alert("Please select a valid image file (PNG, JPG, or WEBP).");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = async function() {
                    // Create offscreen canvas for max 200x200 crop/compression
                    const canvas = document.createElement('canvas');
                    const size = 200;
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');

                    // Center crop square
                    const minDim = Math.min(img.width, img.height);
                    const sx = (img.width - minDim) / 2;
                    const sy = (img.height - minDim) / 2;
                    ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, size, size);

                    const base64Data = canvas.toDataURL('image/jpeg', 0.85);

                    try {
                        const response = await fetchWithAuth('/api/profile/avatar', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ avatar: base64Data })
                        });

                        if (response.ok) {
                            currentSession.avatar = base64Data;
                            localStorage.setItem('zencora_avatar', base64Data);
                            renderUserAvatar('profile-avatar-display', base64Data, currentSession.displayName);
                            renderUserAvatar('user-avatar', base64Data, currentSession.displayName);
                            alert("Profile picture updated successfully!");
                        } else {
                            alert("Failed to save avatar image.");
                        }
                    } catch (err) {
                        alert("Network error updating profile photo.");
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function renderProfileRequestsTable(requests) {

            const badge = document.getElementById('pending-requests-badge');

                    ? `<span class="badge badge-pitched">Pending</span>` 
                    : (r.status === 'approved' ? `<span class="badge badge-won">Approved</span>` : `<span class="badge badge-lost">Rejected</span>`);

                }

        // Load leads database from local server API
        async function loadLeads() {
            try {
                const response = await fetchWithAuth('/api/leads');
                if (response.ok) {
                    leads = await response.json();
                    
                    // Sort leads: Closed-Won first, then newest
                    leads.sort((a, b) => {
                        if (a.leadStage === 'Closed-Won' && b.leadStage !== 'Closed-Won') return -1;
                        if (a.leadStage !== 'Closed-Won' && b.leadStage === 'Closed-Won') return 1;
                        return new Date(b.dateAdded) - new Date(a.dateAdded);
                    });
                    
                    updateStats();
                    renderSpreadsheet();
                    populateBdeFilter();
                    interpolateEmail();
                    if (activeTab === 'view-analytics') {
                        renderAnalytics();
                    }
                }
            } catch (err) {
                console.error('Network error loading leads:', err);
            }
        }

        // Update statistics cards
        function updateStats() {
            let totalPipeline = 0;
            let activeCount = 0;
            let wonCount = 0;
            let lostCount = 0;

            leads.forEach(l => {
                const val = parseFloat(l.estValue) || 0;
                
                if (l.leadStage !== 'Closed-Lost') {
                    totalPipeline += val;
                }
                
                if (l.leadStage !== 'Closed-Won' && l.leadStage !== 'Closed-Lost') {
                    activeCount++;
                } else if (l.leadStage === 'Closed-Won') {
                    wonCount++;
                } else if (l.leadStage === 'Closed-Lost') {
                    lostCount++;
                }
            });

            const resolved = wonCount + lostCount;
            const winRate = resolved > 0 ? (wonCount / resolved * 100).toFixed(1) + '%' : '0.0%';

            document.getElementById('stat-pipeline').innerText = '$' + totalPipeline.toLocaleString();
            document.getElementById('stat-active').innerText = activeCount;
            document.getElementById('stat-won').innerText = wonCount;
            document.getElementById('stat-winrate').innerText = winRate;
        }

        // Render Spreadsheet Grid
        function renderSpreadsheet() {
            const tbody = document.getElementById('leads-tbody');
            tbody.innerHTML = '';

            const searchQuery = document.getElementById('search-query').value.toLowerCase();
            const stageFilter = document.getElementById('filter-stage').value;
            const bdeFilter = currentSession.role === 'bde' ? '' : document.getElementById('filter-bde').value;
            const channelFilter = document.getElementById('filter-channel').value;

            let filteredCount = 0;

            leads.forEach((lead, index) => {
                const matchSearch = !searchQuery || 
                                    lead.name.toLowerCase().includes(searchQuery) ||
                                    (lead.contactName && lead.contactName.toLowerCase().includes(searchQuery)) ||
                                    (lead.ehrSystem && lead.ehrSystem.toLowerCase().includes(searchQuery)) ||
                                    lead.id.toLowerCase().includes(searchQuery);

                const matchStage = !stageFilter || lead.leadStage === stageFilter;
                const matchBde = !bdeFilter || lead.assignedBde === bdeFilter;
                const matchChannel = !channelFilter || lead.outreachChannel === channelFilter;

                if (matchSearch && matchStage && matchBde && matchChannel) {
                    filteredCount++;
                    
                    const tr = document.createElement('tr');
                    tr.dataset.index = index;
                    tr.dataset.id = lead.id;
                    
                    const estValue = parseFloat(lead.estValue) || 0;
                    const formattedValue = '$' + estValue.toLocaleString();

                    let stageBadgeClass = 'badge-sourced';
                    if (lead.leadStage === 'Closed-Won') stageBadgeClass = 'badge-won';
                    else if (lead.leadStage === 'Closed-Lost') stageBadgeClass = 'badge-lost';
                    else if (lead.leadStage === 'Proposal Sent') stageBadgeClass = 'badge-proposal';
                    else if (lead.leadStage === 'Negotiating') stageBadgeClass = 'badge-negotiating';
                    else if (lead.leadStage === 'Discovery Scheduled') stageBadgeClass = 'badge-demo';
                    else if (lead.leadStage === 'Contacted') stageBadgeClass = 'badge-contacted';

                    let fuBadgeClass = 'badge-fu-none';
                    if (lead.followUpStatus === 'Active Conversation') fuBadgeClass = 'badge-fu-active';
                    else if (lead.followUpStatus && lead.followUpStatus.includes('Follow-up')) fuBadgeClass = 'badge-fu-cadence';

                    tr.innerHTML = `
                        <td style="font-weight:600; color:var(--secondary); text-align:center">${lead.id}</td>
                        <td class="editable" data-field="name">${lead.name}</td>
                        <td class="editable" data-field="specialty">${lead.specialty || '-'}</td>
                        <td class="editable" data-field="contactName">${lead.contactName || '-'}</td>
                        <td class="editable" data-field="contactTitle">${lead.contactTitle || '-'}</td>
                        <td class="editable" data-field="contactEmail">${lead.contactEmail || '-'}</td>
                        <td class="editable" data-field="contactPhone">${lead.contactPhone || '-'}</td>
                        <td class="editable" data-field="ehrSystem">${lead.ehrSystem || '-'}</td>
                        <td class="editable" data-field="leadStage" data-type="select-stage"><span class="badge ${stageBadgeClass}">${lead.leadStage}</span></td>
                        <td class="editable" data-field="followUpStatus" data-type="select-followup"><span class="badge ${fuBadgeClass}">${lead.followUpStatus || 'None'}</span></td>
                        <td class="editable" data-field="estValue" style="text-align:right; font-weight:600">${formattedValue}</td>
                        <td class="editable" data-field="assignedBde">${lead.assignedBde}</td>
                        <td class="editable" data-field="dateLastTouch" style="text-align:center">${lead.dateLastTouch || '-'}</td>
                        <td style="text-align:center">
                            <a href="#" style="color:var(--secondary); font-weight:600; text-decoration:none; margin-right:10px" onclick="editLead(${index})">Edit</a>
                            <a href="#" style="color:#C0392B; font-weight:600; text-decoration:none" onclick="deleteLead(${index})">Delete</a>

                    tbody.appendChild(tr);

        // Populating dynamic BDE filters
        function populateBdeFilter() {
            const bdeFilter = document.getElementById('filter-bde');
            if (currentSession && currentSession.role === 'bde') return; // BDE doesn't use this filter

            const bdes = new Set();
            leads.forEach(l => {
                if (l.assignedBde) bdes.add(l.assignedBde.trim());
            });

            const currentSelection = bdeFilter.value;

            bdeFilter.innerHTML = '<option value="">All BDEs</option>';
            bdes.forEach(bde => {
                const opt = document.createElement('option');
                opt.value = bde;
                opt.innerText = bde;
                bdeFilter.appendChild(opt);
            });

            bdeFilter.value = currentSelection;
        }

            renderSpreadsheet();

        // Double-click cell inline editing
        function setupEditableTableEvents() {
            const tbody = document.getElementById('leads-tbody');
            
            tbody.addEventListener('dblclick', (e) => {
                const td = e.target.closest('td.editable');
                if (!td) return;
                
                const tr = td.closest('tr');
                const leadIndex = parseInt(tr.dataset.index);
                const field = td.dataset.field;
                const type = td.dataset.type;
                const currentValue = leads[leadIndex][field];

                // BDE cannot edit BDE assignment cell
                if (currentSession.role === 'bde' && field === 'assignedBde') return;

                if (td.querySelector('input') || td.querySelector('select')) return; // already editing

                if (type === 'select-stage') {
                    const select = document.createElement('select');
                    select.className = 'cell-input';
                    const stages = ['Sourced', 'Contacted', 'Discovery Scheduled', 'Proposal Sent', 'Negotiating', 'Closed-Won', 'Closed-Lost'];
                    stages.forEach(st => {
                        const opt = document.createElement('option');
                        opt.value = st;
                        opt.text = st;
                        if (st === currentValue) opt.selected = true;
                        select.appendChild(opt);
                    });
                    td.innerHTML = '';
                    td.appendChild(select);
                    select.focus();

                    select.addEventListener('blur', () => saveCellEdit(leadIndex, field, select.value, td));
                    select.addEventListener('change', () => saveCellEdit(leadIndex, field, select.value, td));
                }
                else if (type === 'select-followup') {
                    const select = document.createElement('select');
                    select.className = 'cell-input';
                    const list = ['Day 1 - Sent', 'Day 4 - Follow-up 1', 'Day 9 - Follow-up 2', 'Day 15 - Final', 'Active Conversation', 'No Response'];
                    list.forEach(item => {
                        const opt = document.createElement('option');
                        opt.value = item;
                        opt.text = item;
                        if (item === currentValue) opt.selected = true;
                        select.appendChild(opt);
                    });
                    td.innerHTML = '';
                    td.appendChild(select);
                    select.focus();

                    select.addEventListener('blur', () => saveCellEdit(leadIndex, field, select.value, td));
                    select.addEventListener('change', () => saveCellEdit(leadIndex, field, select.value, td));
                }
                else {
                    const input = document.createElement('input');
                    input.type = field === 'estValue' ? 'number' : 'text';
                    input.className = 'cell-input';
                    input.value = currentValue || '';
                    input.setAttribute('autocomplete', 'off');
                    input.setAttribute('spellcheck', 'false');
                    td.innerHTML = '';
                    td.appendChild(input);
                    input.focus();

                    input.addEventListener('blur', () => saveCellEdit(leadIndex, field, input.value, td));
                    input.addEventListener('keydown', (evt) => {
                        if (evt.key === 'Enter') saveCellEdit(leadIndex, field, input.value, td);
                        if (evt.key === 'Escape') renderSpreadsheet();
                    });
                }
            });
        }

        async function saveCellEdit(index, field, newValue, tdElement) {

                leads[index][field] = parseFloat(newValue) || 0;
            } else {
                leads[index][field] = newValue.trim();
            }

            updateStats();
            renderSpreadsheet();
            await saveLeadsToDisk();
            
            populateBdeFilter();
            if (activeTab === 'view-analytics') {
                renderAnalytics();
            }
        }

        async function saveLead(event) {
            event.preventDefault();

            const idx = parseInt(document.getElementById('lead-index').value);
            const today = new Date().toISOString().split('T')[0];
            
            const bdeName = currentSession.role === 'bde' 
                ? currentSession.displayName 
                : document.getElementById('form-bde').value.trim();

            const leadRecord = {
                name: document.getElementById('form-name').value.trim(),
                specialty: document.getElementById('form-specialty').value.trim(),
                ehrSystem: document.getElementById('form-ehr').value.trim(),
                contactName: document.getElementById('form-contact').value.trim(),
                contactTitle: document.getElementById('form-title').value.trim(),
                contactEmail: document.getElementById('form-email').value.trim(),
                contactPhone: document.getElementById('form-phone').value.trim(),
                outreachChannel: document.getElementById('form-channel').value,
                assignedBde: bdeName,
                leadStage: document.getElementById('form-stage').value,
                estValue: parseFloat(document.getElementById('form-value').value) || 0,
                followUpStatus: document.getElementById('form-followup').value,
                nextActionDate: document.getElementById('form-nextaction').value,
                notes: document.getElementById('form-notes').value.trim(),
                dateLastTouch: today
            };

            if (idx === -1) {
                // Generate secure local random Lead ID based on size, or unique seed
                const maxNum = leads.reduce((max, lead) => {
                    const num = parseInt(lead.id.replace('ZHS-LD-', '')) || 0;
                    return num > max ? num : max;
                }, 0);
                
                leadRecord.id = `ZHS-LD-${(maxNum + 1).toString().padStart(3, '0')}`;
                leadRecord.dateAdded = today;
                leads.push(leadRecord);
            } else {
                leadRecord.id = document.getElementById('lead-id').value;
                leadRecord.dateAdded = leads[idx].dateAdded;
                leads[idx] = leadRecord;
            }

            hideLeadDrawer();
            updateStats();
            renderSpreadsheet();
            populateBdeFilter();
            
            await saveLeadsToDisk();

            if (activeTab === 'view-analytics') {
                renderAnalytics();
            }
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const text = e.target.result;
                let importedLeads = [];

                if (file.name.endsWith('.json')) {
                    try {
                        importedLeads = JSON.parse(text);
                    } catch (err) {
                        alert('Error parsing JSON file. Check structure.');
                        return;
                    }
                } 
                else if (file.name.endsWith('.csv')) {
                    importedLeads = parseCSV(text);
                }

                if (importedLeads.length > 0) {
                    const today = new Date().toISOString().split('T')[0];
                    let maxNum = leads.reduce((max, lead) => {
                        const num = parseInt(lead.id.replace('ZHS-LD-', '')) || 0;
                        return num > max ? num : max;
                    }, 0);

                    // Add IDs and dates to imported entries
                    importedLeads.forEach(l => {
                        maxNum++;
                        l.id = l.id || `ZHS-LD-${maxNum.toString().padStart(3, '0')}`;
                        l.dateAdded = l.dateAdded || today;
                        l.name = l.name || 'Unnamed Clinic';
                        l.specialty = l.specialty || '';
                        l.contactName = l.contactName || '';
                        l.contactTitle = l.contactTitle || '';
                        l.contactEmail = l.contactEmail || '';
                        l.contactPhone = l.contactPhone || '';
                        l.ehrSystem = l.ehrSystem || '';
                        l.outreachChannel = l.outreachChannel || 'Email';
                        l.leadStage = l.leadStage || 'Sourced';
                        l.followUpStatus = l.followUpStatus || 'Day 1 - Sent';
                        l.estValue = parseFloat(l.estValue) || 0;
                        
                        // Force BDE to current user if logged in as BDE, else allow import BDE name
                        l.assignedBde = currentSession.role === 'bde' ? currentSession.displayName : (l.assignedBde || 'Unassigned');
                        l.dateLastTouch = l.dateLastTouch || today;
                        l.notes = l.notes || '';
                        leads.push(l);
                    });

                    hideImportDrawer();
                    updateStats();
                    renderSpreadsheet();
                    populateBdeFilter();
                    await saveLeadsToDisk();
                    alert(`Successfully imported ${importedLeads.length} leads!`);
                } else {
                    alert('No leads detected or invalid file structure.');
                }
            };
            reader.readAsText(file);
        }

        // Simple CSV Parser
        function parseCSV(text) {
            const lines = text.split('\n').map(line => line.trim()).filter(line => line);
            if (lines.length <= 1) return [];

            const headers = lines[0].split(',').map(h => h.trim().replace(/^["']|["']$/g, ''));
            const results = [];

            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',').map(v => v.trim().replace(/^["']|["']$/g, ''));
                const obj = {};
                
                headers.forEach((header, idx) => {
                    obj[header] = values[idx] || '';
                });
                results.push(obj);
            }
            return results;
        }
