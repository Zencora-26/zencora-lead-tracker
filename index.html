        // Analytics rendering using ChartJS
        function renderAnalytics() {
            const stageCounts = {
                'Sourced': 0, 'Contacted': 0, 'Discovery Scheduled': 0, 'Proposal Sent': 0, 'Negotiating': 0, 'Closed-Won': 0, 'Closed-Lost': 0
            };
            const stageValues = {
                'Sourced': 0, 'Contacted': 0, 'Discovery Scheduled': 0, 'Proposal Sent': 0, 'Negotiating': 0, 'Closed-Won': 0, 'Closed-Lost': 0
            };
            const bdeData = {};
            const ehrCounts = {};

            leads.forEach(l => {
                if (stageCounts[l.leadStage] !== undefined) {
                    stageCounts[l.leadStage]++;
                    stageValues[l.leadStage] += parseFloat(l.estValue) || 0;
                }

                if (l.assignedBde) {
                    const bde = l.assignedBde.trim();
                    if (!bdeData[bde]) {
                        bdeData[bde] = { managed: 0, won: 0, lost: 0, revenue: 0 };
                    }
                    bdeData[bde].managed++;
                    if (l.leadStage === 'Closed-Won') {
                        bdeData[bde].won++;
                        bdeData[bde].revenue += parseFloat(l.estValue) || 0;
                    } else if (l.leadStage === 'Closed-Lost') {
                        bdeData[bde].lost++;
                    }
                }

                if (l.ehrSystem) {
                    const ehr = l.ehrSystem.trim();
                    if (ehr && ehr !== '-') {
                        ehrCounts[ehr] = (ehrCounts[ehr] || 0) + 1;
                    }
                }
            });

            // 1. Stage Counts Chart
            if (charts.counts) charts.counts.destroy();
            const ctxCounts = document.getElementById('chart-stages').getContext('2d');
            charts.counts = new Chart(ctxCounts, {
                type: 'bar',
                data: {
                    labels: Object.keys(stageCounts),
                    datasets: [{
                        label: 'Number of Prospects',
                        data: Object.values(stageCounts),
                        backgroundColor: [
                            '#94A3B8', // Sourced
                            '#818CF8', // Contacted
                            '#60A5FA', // Demo
                            '#FBBF24', // Proposal
                            '#F59E0B', // Negotiating
                            '#34D399', // Won
                            '#F87171'  // Lost
                        ],
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                }
            });

            // 2. Stage Values Chart
            if (charts.values) charts.values.destroy();
            const ctxValues = document.getElementById('chart-values').getContext('2d');
            charts.values = new Chart(ctxValues, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(stageValues),
                    datasets: [{
                        data: Object.values(stageValues),
                        backgroundColor: [
                            '#94A3B8', '#818CF8', '#60A5FA', '#FBBF24', '#F59E0B', '#34D399', '#F87171'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right', labels: { boxWidth: 12, font: { family: 'Inter' } } }
                    }
                }
            });

            // 3. Render BDE Performance Table
            const bdeTbody = document.getElementById('bde-metrics-tbody');
            bdeTbody.innerHTML = '';
            
            // Hide performance card completely for BDE if they shouldn't compare, or filter to only show them.
            // Let's show only their own line for BDE, and all lines for Admin.
            const isBde = currentSession.role === 'bde';
            
            let totalManaged = 0;
            let totalWon = 0;
            let totalRevenue = 0;

            Object.keys(bdeData).forEach(bdeName => {
                // If user is BDE, filter out other BDE metrics
                if (isBde && bdeName.toLowerCase() !== currentSession.displayName.toLowerCase()) {
                    return;
                }

                const data = bdeData[bdeName];
                const resolved = data.won + data.lost;
                const winRate = resolved > 0 ? (data.won / resolved * 100).toFixed(1) + '%' : '0.0%';
                
                totalManaged += data.managed;
                totalWon += data.won;
                totalRevenue += data.revenue;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight:600; color:var(--text-dark)">${bdeName}</td>
                    <td style="text-align:center">${data.managed}</td>
                    <td style="text-align:center">${data.won}</td>
                    <td style="text-align:right">${winRate}</td>
                    <td style="text-align:right; font-weight:600; color:#27AE60">$${data.revenue.toLocaleString()}</td>
                `;
                bdeTbody.appendChild(tr);
            });

            // Total row (Admin only gets a dynamic summary total line)
            if (!isBde) {
                const trTotal = document.createElement('tr');
                trTotal.style.borderTop = '2px double var(--primary)';
                trTotal.innerHTML = `
                    <td style="font-weight:700; color:var(--primary)">Total Pipeline</td>
                    <td style="text-align:center; font-weight:700">${totalManaged}</td>
                    <td style="text-align:center; font-weight:700">${totalWon}</td>
                    <td style="text-align:right; font-weight:700">-</td>
                    <td style="text-align:right; font-weight:700; color:var(--primary)">$${totalRevenue.toLocaleString()}</td>
                `;
                bdeTbody.appendChild(trTotal);
            }

            // 4. Render EHR Stats Table
            const ehrTbody = document.getElementById('ehr-metrics-tbody');
            ehrTbody.innerHTML = '';

            const sortedEhrs = Object.keys(ehrCounts).sort((a,b) => ehrCounts[b] - ehrCounts[a]);
            sortedEhrs.forEach(ehrName => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight:600; color:var(--secondary)">${ehrName}</td>
                    <td style="text-align:center; font-weight:600">${ehrCounts[ehrName]}</td>
                `;
                ehrTbody.appendChild(tr);
            });
            if (sortedEhrs.length === 0) {
                ehrTbody.innerHTML = '<tr><td colspan="2" style="text-align:center; color:var(--text-muted)">No EHR details logged yet</td></tr>';
            }
        }

        function onLeadSelectChange() {
            const leadIdx = document.getElementById('compose-lead-select').value;
            const specialtySelect = document.getElementById('compose-specialty-select');

            if (leadIdx !== "" && leads[leadIdx]) {
                const leadSpec = (leads[leadIdx].specialty || "").toLowerCase();
                if (leadSpec.includes('cardio')) specialtySelect.value = 'cardiology';
                else if (leadSpec.includes('ortho')) specialtySelect.value = 'orthopedics';
                else if (leadSpec.includes('pediat')) specialtySelect.value = 'pediatrics';
                else if (leadSpec.includes('internal') || leadSpec.includes('family')) specialtySelect.value = 'internal_medicine';
                else if (leadSpec.includes('radio') || leadSpec.includes('imaging')) specialtySelect.value = 'radiology';
                else if (leadSpec.includes('gastro') || leadSpec.includes('gi')) specialtySelect.value = 'gastroenterology';
                else if (leadSpec.includes('derm')) specialtySelect.value = 'dermatology';
                else if (leadSpec.includes('psych') || leadSpec.includes('mental')) specialtySelect.value = 'psychiatry';
                else if (leadSpec.includes('neuro') || leadSpec.includes('pain')) specialtySelect.value = 'neurology';
                else if (leadSpec.includes('urgent') || leadSpec.includes('emergen')) specialtySelect.value = 'urgent_care';
                else if (leadSpec.includes('physic') || leadSpec.includes('rehab') || leadSpec.includes('pt')) specialtySelect.value = 'physical_therapy';
                else if (leadSpec.includes('dent')) specialtySelect.value = 'dental';
                else if (leadSpec.includes('podi') || leadSpec.includes('wound')) specialtySelect.value = 'podiatry';
            }
            interpolateEmail();
        }

        // Interpolate email templates (Works standalone or with selected lead)
        function interpolateEmail() {
            const leadIdx = document.getElementById('compose-lead-select').value;
            const specialtyKey = document.getElementById('compose-specialty-select').value;
            const textarea = document.getElementById('compose-textarea');

            const template = emailTemplates[specialtyKey] || emailTemplates.rcm_general;

            let practiceName = "[Practice Name / Clinic Name]";
            let lastName = "[Doctor / Practice Administrator]";
            let bdeName = currentSession ? currentSession.displayName : "[BDE Name]";

            if (leadIdx !== "" && leads[leadIdx]) {
                const lead = leads[leadIdx];
                if (lead.name) practiceName = lead.name;
                if (lead.contactName) {
                    const parts = lead.contactName.trim().split(' ');
                    lastName = parts[parts.length - 1];
                }
                if (currentSession && currentSession.role === 'bde') {
                    bdeName = currentSession.displayName;
                } else if (lead.assignedBde) {
                    bdeName = lead.assignedBde;
                }
            }

            let interpolated = template
                .replace(/{PracticeName}/g, practiceName)
                .replace(/{LastName}/g, lastName)
                .replace(/{BdeName}/g, bdeName);

            textarea.value = interpolated;
        }

        // Copy composed email text to clipboard
        function copyComposedEmail() {
            const textarea = document.getElementById('compose-textarea');
            if (!textarea.value || textarea.value.trim() === "") {
                alert("No email template available to copy.");
                return;
            }

            textarea.select();
            document.execCommand('copy');
            alert("Email template copied successfully to clipboard!");
        }
